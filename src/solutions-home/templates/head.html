/* Hitelecom Solutions homepage — PC, phone and tablet responsive fix, 2026-11-13.

   Preserve image, content and next-section spacing. */
@media (min-width: 851px) {
  .ht-solutions .hero {

    padding-block: 120px 110px;

    padding-top: 0;

    margin-top: 24px;
  }
}


/* Phone and tablet extension — 2026-11-13.
   Keep this stylesheet page-local to the Solutions homepage. */
@media (max-width: 850px) {
  .ht-solutions .hero {
    height: auto;
    min-height: 100vh;

@media (max-width: 1080px) {

  .ht-site-shell .float-bar .pop {

    bottom: calc(68px + env(safe-area-inset-bottom, 0px));
    width: min(260px, calc(100vw - 32px));
